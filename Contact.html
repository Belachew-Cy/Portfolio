<body>
    <div class="container">

                <a href="./About.html">About</a>
                <a href="./Contact.html" class="active">Contact</a>
            </nav>
        </header>

        <!-- ======== PAGE HEADER ======== -->
        <div class="page-header">
            <h1>Let's <span>connect</span></h1>
            <p>Have a project in mind? I'd love to hear about it.</p>
        </div>

        <!-- ======== CONTACT FORM - CENTERED ======== -->
        <div class="form-wrapper">
            <div class="form-card">
                <h2>Send a message</h2>
                <p class="sub">I'll get back to you within 24 hours.</p>

                <form id="contactForm" onsubmit="event.preventDefault(); alert('Thanks for reaching out! I\'ll respond soon.');">
                    <div class="form-group">
                        <label for="name">Your name</label>
                        <input type="text" id="name" placeholder="John Doe" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email address</label>
                        <input type="email" id="email" placeholder="john@example.com" required />
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Project inquiry" />
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" placeholder="Tell me about your project..." required></textarea>
                    </div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> Send message
                    </button>

                    <div class="form-footer">
                        <i class="fas fa-lock"></i> Your info is safe with me.
                    </div>
                </form>
            </div>
        </div>

        <!-- ======== CONTACT INFO CARDS - HORIZONTAL BELOW FORM ======== -->
        
    </div>
